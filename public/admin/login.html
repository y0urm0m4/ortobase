<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    (function () {
      var t = localStorage.getItem('ortobase-theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · Ortobase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link id="theme-css" rel="stylesheet" href="assets/css/light.css">
</head>
<body>

  <button id="themeToggle" class="btn position-fixed top-0 end-0 m-3 border-0" type="button">
    <i class="bi bi-moon fs-5 text-muted"></i>
  </button>

  <div class="d-flex min-vh-100 align-items-center justify-content-center px-3" style="background: var(--bg-page)">
    <div class="card shadow-sm rounded-4 w-100" style="max-width: 420px; border-color: var(--border);">
      <div class="card-body p-4 p-sm-5">

        <div class="mb-4">
          <div class="d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-heart-pulse-fill fs-4" style="color: var(--accent)"></i>
            <span class="fw-bold fs-5" style="color: var(--text-main)">Ortobase</span>
          </div>
          <p class="small mb-0" style="color: var(--text-muted)">Панель администратора · вход для сотрудников</p>
        </div>

        <div class="mb-3">
          <label for="emailInput" class="form-label small fw-medium">E-mail</label>
          <input id="emailInput" type="email" class="form-control" placeholder="admin@ortobase.ru">
        </div>

        <div class="mb-3">
          <label for="passInput" class="form-label small fw-medium">Пароль</label>
          <input id="passInput" type="password" class="form-control" placeholder="••••••••">
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="remme" checked>
            <label class="form-check-label small" for="remme">Запомнить меня</label>
          </div>
          <a href="#" class="small text-decoration-none" style="color: var(--accent)">Забыли пароль?</a>
        </div>

        <a href="dashboard.html" class="btn w-100 py-2 rounded-3 fw-semibold text-white border-0"
           style="background: var(--accent)">Войти</a>

        <div class="mt-4 p-3 rounded-3 small" style="background: var(--bg-soft); color: var(--text-muted)">
          Доступ только для сотрудников Ortobase. Все действия логируются.
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
</body>
</html>
